  <rect x="278" y="404" width="196" height="74" fill="#fff" stroke="#4A4F55" stroke-width="1.5"/>
  <rect x="290" y="414" width="172" height="8" rx="2" fill="#9AA5B1"/>
  <rect x="290" y="430" width="130" height="6" rx="2" fill="#C9D2DC"/>
  <rect x="290" y="442" width="140" height="6" rx="2" fill="#C9D2DC"/>
  <rect x="290" y="458" width="100" height="8" rx="2" fill="#9AA5B1"/>
  <path d="M446 432l14 12-14 12-14-12z" fill="none" stroke="#9AA5B1" stroke-width="1.5"/>

