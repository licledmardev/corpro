  <rect x="38" y="574" width="168" height="7" rx="2" fill="#E3E8EE"/>
  <line x1="222" y1="552" x2="222" y2="638" stroke="#4A4F55" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="236" y="556" width="120" height="9" rx="2" fill="#C9D2DC"/><rect x="390" y="556" width="84" height="9" rx="2" fill="#C9D2DC"/>
