<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720" viewBox="0 0 520 720" role="img" aria-labelledby="t d">
  <title id="t">Ubicación del número de suministro en el recibo de luz</title>
  <desc id="d">Ilustración de un recibo de luz. El número de suministro está resaltado en la parte superior izquierda, junto al texto "Para consultas, su código".</desc>
  <defs>
    <filter id="sombra" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#082E55" flood-opacity=".18"/>
    </filter>
    <pattern id="trama" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#F7F9FC"/>
      <path d="M0 22 22 0" stroke="#E6ECF4" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="520" height="720" fill="#F2F5F8"/>

  <!-- Hoja -->
  <g filter="url(#sombra)"><rect x="20" y="18" width="480" height="684" rx="8" fill="#fff"/></g>

  <!-- ===== Cabecera izquierda ===== -->
