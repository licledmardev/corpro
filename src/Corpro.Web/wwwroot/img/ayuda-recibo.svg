  <path fill="#fff" fill-opacity=".55" fill-rule="evenodd"
        d="M20 18h480v684H20z M34 78h284a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H34a8 8 0 0 1-8-8V86a8 8 0 0 1 8-8z"/>
  <rect x="26" y="78" width="300" height="40" rx="8" fill="none" stroke="#1E7D28" stroke-width="3.5"/>

  <!-- Llamada -->
  <path d="M338 98 350 88v20z" fill="#1E7D28"/>
  <rect x="350" y="72" width="140" height="52" rx="10" fill="#1E7D28"/>
  <text x="420" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Su número de</text>
  <text x="420" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">suministro</text>
</svg>
