  <text x="38" y="528" font-family="Arial, sans-serif" font-size="11" fill="#2E64AE">FECHA DE VENCIMIENTO</text>
  <rect x="186" y="519" width="62" height="10" rx="3" fill="#C9D2DC"/>
  <text x="290" y="528" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2933">TOTAL A PAGAR</text>
  <rect x="398" y="519" width="76" height="10" rx="3" fill="#C9D2DC"/>

