  <text x="38" y="102" font-family="Arial, sans-serif" font-size="12.5" font-style="italic" fill="#1F2933">Para Consultas, su código</text>
  <text x="196" y="105" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#082E55">12345678</text>

  <rect x="38" y="122" width="150" height="10" rx="3" fill="#C9D2DC"/>
  <rect x="38" y="138" width="190" height="9" rx="3" fill="#E3E8EE"/>
  <rect x="38" y="152" width="160" height="9" rx="3" fill="#E3E8EE"/>

  <!-- ===== Cabecera derecha: logotipo genérico de la empresa ===== -->
  <rect x="404" y="32" width="38" height="38" rx="8" fill="#0072CE"/>
  <path d="M404 70 442 32v28a10 10 0 0 1-10 10z" fill="#2EA937"/>
  <rect x="362" y="80" width="122" height="12" rx="3" fill="#C9D2DC"/>
  <rect x="352" y="100" width="132" height="7" rx="3" fill="#E3E8EE"/>
