  <rect x="34" y="172" width="220" height="22" rx="4" fill="#2E64AE"/>
  <text x="144" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#fff">DATOS DEL SUMINISTRO DE CONSUMO</text>
  <g fill="#C9D2DC">
    <rect x="44" y="204" width="62" height="7" rx="2"/><rect x="118" y="204" width="96" height="7" rx="2"/>
