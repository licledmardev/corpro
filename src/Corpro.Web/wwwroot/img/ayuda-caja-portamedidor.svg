<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">Ubicación del número de suministro en la caja portamedidor</title>
  <desc id="d">Ilustración de una caja portamedidor en la pared con el número de suministro pintado en la tapa.</desc>
  <defs>
    <pattern id="ladrillo" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#EDE6DF"/>
      <path d="M0 20H80M0 40H80M40 0V20M0 20V40M80 20V40" stroke="#D8CCC0" stroke-width="2"/>
    </pattern>
    <filter id="sombra" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#082E55" flood-opacity=".22"/>
    </filter>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#1E7D28"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="url(#ladrillo)"/>

  <!-- Tubo de acometida -->
  <rect x="304" y="0" width="22" height="40" fill="#9AA5B1"/>
  <rect x="304" y="380" width="22" height="40" fill="#9AA5B1"/>

  <!-- Caja -->
  <g filter="url(#sombra)">
    <rect x="196" y="34" width="238" height="352" rx="14" fill="#B8C2CC"/>
  </g>
  <rect x="210" y="48" width="210" height="324" rx="10" fill="#CED6DE" stroke="#9AA5B1" stroke-width="2"/>

  <!-- Visor del medidor -->
  <rect x="236" y="72" width="158" height="118" rx="10" fill="#E8F1F8" stroke="#8A96A3" stroke-width="3"/>
  <rect x="256" y="92" width="118" height="78" rx="6" fill="#fff" stroke="#C3CCD6" stroke-width="2"/>
  <rect x="270" y="106" width="90" height="26" rx="3" fill="#082E55"/>
  <text x="315" y="125" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#7CF08A">04512</text>
  <text x="315" y="152" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="11" fill="#4A4F55">kWh</text>
  <text x="315" y="208" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="10" fill="#4A4F55">MEDIDOR</text>

  <!-- Número pintado en la tapa (resaltado) -->
  <rect x="234" y="238" width="162" height="62" rx="8" fill="#fff"/>
  <text x="315" y="281" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#082E55">12345678</text>
  <rect x="226" y="230" width="178" height="78" rx="12" fill="none" stroke="#2EA937" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- Cerradura -->
  <circle cx="400" cy="340" r="9" fill="#8A96A3"/>
  <rect x="397" y="336" width="6" height="10" rx="2" fill="#5D6873"/>

  <!-- Llamada -->
  <path d="M478 269 H410" stroke="#1E7D28" stroke-width="3" fill="none" marker-end="url(#flecha)"/>
  <rect x="478" y="226" width="148" height="86" rx="10" fill="#1E7D28"/>
  <text x="552" y="256" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Número pintado</text>
  <text x="552" y="276" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">o en etiqueta</text>
  <text x="552" y="296" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">sobre la tapa</text>
</svg>
